<!-- Thinking indicator with SSE connection -->
<div id="sse-container"
     hx-ext="sse"
     sse-connect="/stream-supplemental/{{ char_token }}"
     sse-swap="personality"
     hx-swap="outerHTML"
     sse-close="close">
    <h3 class="font-display text-sm text-gold-500 uppercase tracking-wider">Personality</h3>
    <div class="mt-2 flex items-center gap-4 text-parchment-400">
        <!-- D20 with attempt number and pulse animation -->
        <div class="relative w-12 h-12 flex-shrink-0 animate-d20-pulse">
            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-lg">
                <defs>
                    <linearGradient id="d20-main" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#2a1a3e"/>
                        <stop offset="100%" style="stop-color:#1a1028"/>
                    </linearGradient>
                    <linearGradient id="d20-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#1a1028"/>
                        <stop offset="100%" style="stop-color:#0a0510"/>
                    </linearGradient>
                </defs>
                <!-- Outer silhouette - irregular polygon suggesting 3D icosahedron -->
                <polygon points="50,2 95,30 82,90 18,90 5,30" fill="url(#d20-dark)" stroke="#d4a574" stroke-width="2"/>
                <!-- Main visible face - large triangle -->
                <polygon points="50,12 80,75 20,75" fill="url(#d20-main)" stroke="#d4a574" stroke-width="1.5"/>
                <!-- Edge lines to adjacent faces -->
                <line x1="50" y1="12" x2="5" y2="30" stroke="#d4a574" stroke-width="1" opacity="0.6"/>
                <line x1="50" y1="12" x2="95" y2="30" stroke="#d4a574" stroke-width="1" opacity="0.6"/>
                <line x1="20" y1="75" x2="18" y2="90" stroke="#d4a574" stroke-width="1" opacity="0.6"/>
                <line x1="80" y1="75" x2="82" y2="90" stroke="#d4a574" stroke-width="1" opacity="0.6"/>
                <!-- Number on the face -->
                <text id="d20-number-svg"
                      x="50" y="55"
                      text-anchor="middle"
                      dominant-baseline="middle"
                      fill="#d4a574"
                      font-family="serif"
                      font-weight="bold"
                      font-size="24">20</text>
            </svg>
        </div>
        <div class="flex flex-col">
            <span id="status-text" class="italic">Consulting the sages...</span>
            <span id="elapsed-time" class="text-xs text-parchment-500 mt-1">0s</span>
        </div>
    </div>
    <!-- Hidden element for retry SSE updates - HTMX will swap content here -->
    <div id="retry-target" sse-swap="retry" hx-swap="innerHTML" class="hidden"></div>
    <div sse-swap="downloads" hx-swap="innerHTML" hx-target="#download-buttons"></div>
</div>

<style>
    @keyframes d20-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(212, 165, 116, 0.3)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(212, 165, 116, 0.6)); }
    }
    .animate-d20-pulse {
        animation: d20-pulse 2s ease-in-out infinite;
    }
</style>

<script>
    (function() {
        const statusMessages = [
            "Consulting the sages...",
            "Rolling for inspiration...",
            "Deciphering ancient texts...",
            "Communing with the Weave...",
            "Seeking wisdom from Candlekeep...",
            "Peering into the mists of fate..."
        ];
        let messageIndex = 0;
        let elapsed = 0;
        const statusEl = document.getElementById('status-text');
        const elapsedEl = document.getElementById('elapsed-time');
        const d20SvgEl = document.getElementById('d20-number-svg');

        // Update elapsed time every second
        const timerInterval = setInterval(() => {
            elapsed++;
            if (elapsedEl) elapsedEl.textContent = elapsed + 's';
        }, 1000);

        // Rotate status message every 4 seconds
        const messageInterval = setInterval(() => {
            messageIndex = (messageIndex + 1) % statusMessages.length;
            if (statusEl) statusEl.textContent = statusMessages[messageIndex];
        }, 4000);

        // Listen for HTMX SSE messages and update d20 on retry events
        document.body.addEventListener('htmx:sseMessage', (event) => {
            // Check if this is a retry event
            if (event.detail.type === 'retry') {
                const d20Val = event.detail.data.trim();
                if (d20Val && d20SvgEl) {
                    d20SvgEl.textContent = d20Val;
                    console.log('D20 updated to:', d20Val);
                }
            }
        });

        // Cleanup when SSE container is replaced and stop download spinner if error
        const observer = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
                for (const node of mutation.removedNodes) {
                    if (node.id === 'sse-container') {
                        clearInterval(timerInterval);
                        clearInterval(messageInterval);
                        observer.disconnect();

                        // Check if replacement contains error - if so, update download buttons
                        const downloadButtons = document.getElementById('download-buttons');
                        if (downloadButtons && downloadButtons.querySelector('.animate-spin')) {
                            // Still has spinner, meaning downloads event didn't process - remove it
                            const spinner = downloadButtons.querySelector('.animate-spin');
                            if (spinner) {
                                const spinnerContainer = spinner.closest('.flex.items-center');
                                if (spinnerContainer) spinnerContainer.remove();
                            }
                            // Remove confirmation dialogs from download links
                            downloadButtons.querySelectorAll('a[onclick]').forEach(a => {
                                a.removeAttribute('onclick');
                                a.classList.remove('text-parchment-400');
                                a.classList.add('text-parchment-100');
                            });
                        }
                    }
                }
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
</script>
