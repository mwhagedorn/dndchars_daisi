<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}D&D 5e Character Generator{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        parchment: {
                            50: '#faf6f1',
                            100: '#f0e6d8',
                            200: '#e0d0b8',
                            300: '#c9b896',
                            400: '#b49d73',
                            500: '#a08660',
                            600: '#8a7050',
                            700: '#705a42',
                            800: '#5c4a38',
                            900: '#4d3f31',
                        },
                        gold: {
                            50: '#fdf9e9',
                            100: '#faf0c5',
                            200: '#f6e08d',
                            300: '#f0c94b',
                            400: '#e9b422',
                            500: '#c9a227',
                            600: '#a67c1a',
                            700: '#845b18',
                            800: '#6d491b',
                            900: '#5c3d1c',
                        },
                        dungeon: {
                            50: '#f4f4f5',
                            100: '#e4e4e7',
                            200: '#c8c8d0',
                            300: '#a1a1aa',
                            400: '#71717a',
                            500: '#52525b',
                            600: '#3f3f46',
                            700: '#2d2d35',
                            800: '#1e1e24',
                            900: '#141418',
                            950: '#09090b',
                        },
                        blood: {
                            500: '#8b0000',
                            600: '#6b0000',
                            700: '#4a0000',
                        }
                    },
                    fontFamily: {
                        'display': ['Cinzel', 'serif'],
                        'body': ['Crimson Text', 'serif'],
                    },
                    backgroundImage: {
                        'noise': "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E\")",
                    }
                }
            }
        }
    </script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline !important; }
        .htmx-request .htmx-indicator-hide { display: none !important; }
        .htmx-request button { opacity: 0.7; cursor: wait; }
        form.htmx-request { pointer-events: none; }

        /* Parchment texture overlay */
        .parchment-bg {
            position: relative;
        }
        .parchment-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            border-radius: inherit;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e24; }
        ::-webkit-scrollbar-thumb { background: #c9a227; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e9b422; }

        /* Glowing border effect */
        .glow-border {
            box-shadow: 0 0 15px rgba(201, 162, 39, 0.3), inset 0 0 15px rgba(201, 162, 39, 0.1);
        }
    </style>
    {% block head %}{% endblock %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('HTMX loaded:', typeof htmx !== 'undefined');
        });
        // HTMX debugging
        document.addEventListener('htmx:beforeRequest', function(evt) {
            console.log('HTMX beforeRequest:', evt.detail);
            document.body.style.cursor = 'wait';
        });
        document.addEventListener('htmx:afterRequest', function(evt) {
            console.log('HTMX afterRequest:', evt.detail);
            document.body.style.cursor = 'default';
        });
        document.addEventListener('htmx:responseError', function(evt) {
            console.error('HTMX responseError:', evt.detail);
            document.body.style.cursor = 'default';
        });
        document.addEventListener('htmx:sendError', function(evt) {
            console.error('HTMX sendError:', evt.detail);
        });
    </script>
</head>
<body class="bg-dungeon-950 text-parchment-100 min-h-screen font-body">
    <!-- Background decoration -->
    <div class="fixed inset-0 bg-gradient-to-b from-dungeon-900 via-dungeon-950 to-black pointer-events-none"></div>
    <div class="fixed inset-0 opacity-5 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cpath d=&quot;M30 0L60 30L30 60L0 30z&quot; fill=&quot;none&quot; stroke=&quot;%23c9a227&quot; stroke-width=&quot;0.5&quot;/%3E%3C/svg%3E');"></div>

    <div class="relative z-10">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
